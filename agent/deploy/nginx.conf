limit_req_zone $binary_remote_addr zone=insta360_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=insta360_connections:10m;

server {
    listen 80;
    server_name 101.37.234.129;
    location /.well-known/acme-challenge/ {
        root /var/www/insta360-acme;
    }
    location / {
        return 308 https://101.37.234.129$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 101.37.234.129;
    ssl_certificate /etc/letsencrypt/live/insta360-agent/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insta360-agent/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location = /v1/polish {
        limit_req zone=insta360_api burst=5 nodelay;
        limit_req_status 429;
        limit_conn insta360_connections 3;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
